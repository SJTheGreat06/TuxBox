<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" aria-labelledby="map-title map-description" font-family="'Terminess Nerd Font Mono', 'DejaVu Sans Mono', Consolas, monospace" role="img" viewBox="0 0 1000 880"><title id="map-title">TuxBox runtime compatibility</title><desc id="map-description">Overall coverage gives equal weight to verified library behaviors and RDNA 2 instructions converted to HLSL that compiles to DXIL.</desc><rect width="1000" height="880" x="0" y="0" fill="#0b0b0f"/><rect width="1000" height="48" x="0" y="0" fill="#090910"/><rect width="1000" height="1" x="0" y="47" fill="#272733"/><rect width="210" height="27" x="14" y="10" fill="#e2bc8c"/><text x="119" y="29" fill="#0b0b0f" font-size="15" font-weight="bold" text-anchor="middle">Runtime compatibility</text><text x="500" y="32" fill="#e2bc8c" font-size="22" font-weight="bold" letter-spacing="4" text-anchor="middle">TUXBOX</text><text x="986" y="30" fill="#6fc7d4" font-size="16" font-weight="normal" text-anchor="end">Xbox Series X|S</text><g transform="translate(14 60)"><title>Overall TuxBox coverage</title><rect width="972" height="112" x="0" y="0" fill="#14141d" stroke="#e2bc8c"/><text x="18" y="32" fill="#e2bc8c" font-size="25" font-weight="bold" text-anchor="start">Overall TuxBox coverage</text><text x="954" y="32" fill="#6fc7d4" font-size="23" font-weight="bold" text-anchor="end">76.4%</text><rect width="936" height="8" x="18" y="45" fill="#272733"/><rect width="714.916" height="8" x="18" y="45" fill="#6fc7d4"/><text x="18" y="77" fill="#d7d7de" font-size="15" font-weight="normal" text-anchor="start">Library behaviors · 8/9 verified (88.9%)</text><text x="954" y="77" fill="#d7d7de" font-size="15" font-weight="normal" text-anchor="end">RDNA 2 instructions · 693/1,085 (63.9%)</text><text x="18" y="99" fill="#a0a0b1" font-size="13" font-weight="normal" text-anchor="start">50% required library behaviors, 50% RDNA 2 instructions converted to DXIL.</text></g><g transform="translate(14 184)"><title>RDNA 2 instructions</title><rect width="972" height="236" x="0" y="0" fill="#14141d" stroke="#272733" stroke-width="1"/><rect width="970" height="32" x="1" y="1" fill="#0d0d15"/><rect width="970" height="1" x="1" y="33" fill="#272733"/><circle cx="16" cy="17" r="4.5" fill="#e74c3c"/><circle cx="32" cy="17" r="4.5" fill="#f1c40f"/><circle cx="48" cy="17" r="4.5" fill="#2ecc71"/><text x="68" y="22" fill="#6fc7d4" font-size="14" font-weight="normal" text-anchor="start">~/docs/INSTRUCTIONS.md</text><text x="18" y="70" fill="#e2bc8c" font-size="25" font-weight="bold" text-anchor="start">RDNA 2 instructions</text><text x="18" y="96" fill="#d7d7de" font-size="15" font-weight="normal" text-anchor="start">Converted to HLSL that compiles to DXIL</text><rect width="936" height="1" x="18" y="110" fill="#272733"/><text x="18" y="128" fill="#d7d7de" font-size="15" font-weight="normal" text-anchor="start">All instructions</text><text x="400" y="128" fill="#d7d7de" font-size="14" font-weight="normal" text-anchor="start">converted to DXIL</text><rect width="125" height="6" x="610" y="118" fill="#272733"/><rect width="79.839" height="6" x="610" y="118" fill="#6fc7d4"/><text x="870" y="128" fill="#d7d7de" font-size="14" font-weight="normal" text-anchor="end">693/1,085</text><text x="954" y="128" fill="#d7d7de" font-size="14" font-weight="normal" text-anchor="end">63.9%</text><rect width="936" height="1" x="18" y="138" fill="#272733"/><text x="18" y="156" fill="#d7d7de" font-size="15" font-weight="normal" text-anchor="start">Used in recorded shaders</text><text x="400" y="156" fill="#d7d7de" font-size="14" font-weight="normal" text-anchor="start">converted to DXIL</text><rect width="125" height="6" x="610" y="146" fill="#272733"/><rect width="125" height="6" x="610" y="146" fill="#6fc7d4"/><text x="870" y="156" fill="#d7d7de" font-size="14" font-weight="normal" text-anchor="end">372/372</text><text x="954" y="156" fill="#d7d7de" font-size="14" font-weight="normal" text-anchor="end">100.0%</text><rect width="936" height="1" x="18" y="166" fill="#272733"/><text x="18" y="184" fill="#d7d7de" font-size="15" font-weight="normal" text-anchor="start">Used in recorded shaders</text><text x="400" y="184" fill="#d7d7de" font-size="14" font-weight="normal" text-anchor="start">run on AMD and NVIDIA</text><rect width="125" height="6" x="610" y="174" fill="#272733"/><rect width="125" height="6" x="610" y="174" fill="#6fc7d4"/><text x="870" y="184" fill="#d7d7de" font-size="14" font-weight="normal" text-anchor="end">372/372</text><text x="954" y="184" fill="#d7d7de" font-size="14" font-weight="normal" text-anchor="end">100.0%</text><text x="18" y="218" fill="#a0a0b1" font-size="13" font-weight="normal" text-anchor="start">Compiled alone through DXC and DXV, or run by a GPU check. Compiling doesn&apos;t prove a result matches the console.</text></g><g transform="translate(14 432)"><title>Required library behaviors</title><rect width="972" height="402" x="0" y="0" fill="#14141d" stroke="#272733" stroke-width="1"/><rect width="970" height="32" x="1" y="1" fill="#0d0d15"/><rect width="970" height="1" x="1" y="33" fill="#272733"/><circle cx="16" cy="17" r="4.5" fill="#e74c3c"/><circle cx="32" cy="17" r="4.5" fill="#f1c40f"/><circle cx="48" cy="17" r="4.5" fill="#2ecc71"/><text x="68" y="22" fill="#6fc7d4" font-size="14" font-weight="normal" text-anchor="start">~/docs/LIBRARIES.md</text><text x="18" y="70" fill="#e2bc8c" font-size="25" font-weight="bold" text-anchor="start">Required library behaviors</text><text x="18" y="96" fill="#d7d7de" font-size="15" font-weight="normal" text-anchor="start">Verified in a game run or focused check. Partial means some behavior still needs verification.</text><text x="18" y="122" fill="#a0a0b1" font-size="13" font-weight="normal" text-anchor="start">Behavior</text><text x="420" y="122" fill="#a0a0b1" font-size="13" font-weight="normal" text-anchor="start">Provided by</text><text x="954" y="122" fill="#a0a0b1" font-size="13" font-weight="normal" text-anchor="end">Status</text><g><title>d3d12_xs.dll</title><rect width="936" height="1" x="18" y="130" fill="#272733"/><text x="18" y="149" fill="#d7d7de" font-size="15" font-weight="normal" text-anchor="start">Submit and present frames</text><text x="420" y="149" fill="#d7d7de" font-size="14" font-weight="normal" text-anchor="start">TuxBox D3D12</text><text x="954" y="149" fill="#2ecc71" font-size="14" font-weight="bold" text-anchor="end">Verified</text></g><g><title>xg_xs.dll</title><rect width="936" height="1" x="18" y="159" fill="#272733"/><text x="18" y="178" fill="#d7d7de" font-size="15" font-weight="normal" text-anchor="start">Address game textures</text><text x="420" y="178" fill="#d7d7de" font-size="14" font-weight="normal" text-anchor="start">TuxBox or packaged XG</text><text x="954" y="178" fill="#2ecc71" font-size="14" font-weight="bold" text-anchor="end">Verified</text></g><g><title>dxcompiler_xs.dll</title><rect width="936" height="1" x="18" y="188" fill="#272733"/><text x="18" y="207" fill="#d7d7de" font-size="15" font-weight="normal" text-anchor="start">Create DXC utilities</text><text x="420" y="207" fill="#d7d7de" font-size="14" font-weight="normal" text-anchor="start">TuxBox to desktop DXC</text><text x="954" y="207" fill="#2ecc71" font-size="14" font-weight="bold" text-anchor="end">Verified</text></g><g><title>xmem.dll</title><rect width="936" height="1" x="18" y="217" fill="#272733"/><text x="18" y="236" fill="#d7d7de" font-size="15" font-weight="normal" text-anchor="start">Map CPU memory</text><text x="420" y="236" fill="#d7d7de" font-size="14" font-weight="normal" text-anchor="start">TuxBox XMem</text><text x="954" y="236" fill="#2ecc71" font-size="14" font-weight="bold" text-anchor="end">Verified</text></g><g><title>xgameruntime.dll</title><rect width="936" height="1" x="18" y="246" fill="#272733"/><text x="18" y="265" fill="#d7d7de" font-size="15" font-weight="normal" text-anchor="start">Start runtime task qu